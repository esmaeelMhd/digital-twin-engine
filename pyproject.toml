[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-engine"
version = "0.1.0"
description = "Surrogate models of chemical process systems using physics-constrained latent neural SDEs, with an MPC loop and a REST API."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    # Core: everything needed to generate data, train, evaluate, and run MPC.
    "jax>=0.4.20",
    "equinox>=0.11.0",
    "diffrax>=0.4.0",
    "optax>=0.1.7",
    "jaxtyping>=0.2.20",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "h5py>=3.9.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# CUDA wheels are opt-in: the base install works on CPU-only machines and in CI.
# Install with `pip install -e ".[cuda]"` on a GPU host.
cuda = [
    "jax[cuda12]>=0.4.20",
]
# REST API service (dte/api).
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
# Streamlit dashboards (app/) and latent-space plots.
dashboard = [
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "scikit-learn>=1.3.0",
]
# LLM-driven autoresearch loop (scripts/agent.py). The provider SDKs are
# imported lazily, so nothing here is needed to train or evaluate a model.
autoresearch = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]
tracking = [
    "wandb>=0.15.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    # tests/ imports fastapi.testclient and scripts.agent at module level, so
    # the suite needs both extras even though the LLM SDKs load lazily.
    "digital-twin-engine[api,autoresearch]",
]
all = [
    "digital-twin-engine[api,dashboard,autoresearch,tracking]",
]

[tool.hatch.build.targets.wheel]
packages = ["dte"]

[tool.pytest.ini_options]
# Eight test modules import helpers from scripts/, which is not part of the
# installed wheel. Putting the repository root on sys.path makes those imports
# work the same way whether pytest runs from a checkout or against an install.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # existing long lines; not a review blocker
    "E741",  # short names like l, O used in math-adjacent code
    "E402",  # scripts sometimes import after runtime logging setup
    "E731",  # lambdas used as local callables in JAX modules
    "F821",  # jaxtyping Array/Float names in annotations
    "F722",  # jaxtyping shape strings in annotations
    "W293",  # trailing whitespace on blank lines in existing files
]
