[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-engine"
version = "0.1.0"
description = "AI-powered digital twin engine for chemical process systems. Uses physics-constrained latent neural SDEs for fast simulation and model predictive control."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "jax[cuda12]>=0.4.20",
    "equinox>=0.11.0",
    "diffrax>=0.4.0",
    "optax>=0.1.7",
    "jaxtyping>=0.2.20",
    "pyyaml>=6.0",
    "h5py>=3.9.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "casadi>=3.6.0",
    "do-mpc>=4.5.0",
    "pytest>=7.4.0",
    "tqdm>=4.66.0",
    "wandb>=0.15.0",
    "scikit-learn>=1.3.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "rich>=13.0.0",
    "nvidia-ml-py>=12.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dte"]
