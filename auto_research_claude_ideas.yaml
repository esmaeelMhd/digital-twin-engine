ideas:

  # ── Tier 1: Feasible within autoresearch harness, single-file changes ──────

  - id: koopman_linear_drift
    priority: 10
    target_file: dte/models/latent_sde.py
    title: Replace the unstructured MLP drift with a Koopman-style linear map A(u,c)·z + B(u,c)·w so latent dynamics are globally linear at any given operating point.
    rationale: >
      Koopman theory guarantees that any nonlinear dynamical system has a linear
      representation in a lifted space. If the encoder learns the right embedding,
      the SDE drift becomes a state-space A·z + B·u matrix pair conditioned on
      params and controls. Benefits: (a) analytical matrix-exponential prediction
      bypasses the ODE solve, (b) MPC reduces to a convex QP, (c) stability is
      enforceable by constraining eigenvalues of A. Many process systems near a
      single operating point are already close to linear, so the inductive bias
      should not hurt and may generalise strongly across systems.
    instructions:
      - Output A (latent_dim × latent_dim) and B (latent_dim × control_dim) as
        small linear layers conditioned on concatenated (u_norm, d_norm, c_norm).
      - Keep the existing input normalisation pipeline untouched.
      - Preserve residual/skip paths for stability at initialisation.
      - Zero-initialise the off-diagonal part of A; start near identity + small noise.
      - Do not introduce system-specific structure or hardcoded dimensions.

  - id: wasserstein_kl_replacement
    priority: 20
    target_file: dte/training/losses.py
    title: Replace the KL divergence term with a Sinkhorn divergence on mini-batch aggregate posteriors to prevent posterior collapse and enable sharper multi-modal latent structure.
    rationale: >
      KL(q(z|x) || N(0,I)) causes posterior collapse: the model ignores z and
      reconstructs purely from controls. Sinkhorn (Wasserstein-2 approximation)
      pushes the aggregate posterior q(z) = E_x[q(z|x)] toward the prior without
      forcing each individual posterior to be Gaussian. This allows sharper,
      multi-modal latent structure corresponding to distinct operating regimes
      (startup, steady-state, upset). The Sinkhorn algorithm is differentiable
      and runs efficiently in JAX on GPU with O(n² · ε⁻¹) cost per batch.
    instructions:
      - Implement Sinkhorn divergence using the log-stabilised Sinkhorn-Knopp
        iterations; use ε = 0.1 as a starting default.
      - Accept a `sinkhorn_reg` config key under `loss_weights`; fall back to
        existing KL if key is absent so existing configs do not break.
      - Keep the KL annealing schedule plumbing intact; apply it to the Sinkhorn
        weight as well for a smooth transition.
      - Reduce the number of Sinkhorn iterations to ≤ 50 to keep step time
        comparable to the current KL computation.

  - id: lagrange_multiplier_physics
    priority: 30
    target_file: dte/training/losses.py
    title: Replace fixed physics loss weights with learned dual variables (Lagrange multipliers) that enforce mass and energy residual constraints as soft-hard constraints via primal-dual gradient descent.
    rationale: >
      The current fixed physics weights are a brittle compromise: too low and
      physics is ignored, too high and training explodes (documented as the
      primary NaN cause). Learned dual variables λ_mass, λ_energy automatically
      increase when constraints are violated and decrease when satisfied, finding
      the tightest constraint the model can satisfy at each training stage. This
      is the principled way to do constrained optimisation and removes the need
      to hand-tune physics weights across different systems. The dual variables
      are scalars updated with a small dual learning rate, adding negligible cost.
    instructions:
      - Add `lambda_mass` and `lambda_energy` as learnable scalar arrays (not
        inside the JAX model; update them in the Python training loop each step).
      - Dual update: λ ← max(0, λ + α_dual · residual) after each primal step.
      - Add `dual_lr` (default 1e-3) and `constraint_slack` (default 0.01) under
        a new `physics_constraints` config block; fall back to legacy fixed weights
        if block is absent.
      - Clip dual variables to a maximum value (e.g. 10.0) to prevent runaway
        amplification during the first few unstable epochs.
      - Keep the physics residual computation path unchanged.

  # ── Tier 2: Structural changes, higher reward, higher risk ─────────────────

  - id: port_hamiltonian_drift
    priority: 40
    target_file: dte/models/latent_sde.py
    title: Restructure LatentDrift as a port-Hamiltonian system dz=(J(z)-R(z))∇H(z)dt + B(z)u dt where J is skew-symmetric (energy coupling) and R is positive-definite (dissipation), guaranteeing passivity by construction.
    rationale: >
      Dissipativity is the single most universal property of thermodynamic
      industrial processes. A port-Hamiltonian structure bakes passivity in by
      construction: the model cannot generate energy from nothing, which is the
      most common unphysical failure mode in neural surrogates. J captures
      conservative energy exchange between latent modes (analogous to reversible
      reactions), R captures irreversible dissipation (heat losses, friction).
      The Hamiltonian H(z) is a small scalar network. This prior generalises
      across every thermodynamic system — CSTR, heat exchangers, reactors,
      distillation — because they all obey dissipation-dominated dynamics.
    instructions:
      - Parameterise J(z) = W(z) - W(z)ᵀ where W is a small MLP output reshaped
        to (latent_dim × latent_dim); this guarantees skew-symmetry cheaply.
      - Parameterise R(z) = L(z)ᵀ L(z) where L is lower-triangular via
        jnp.tril; guarantees positive-semi-definiteness.
      - H(z) is a 2-layer MLP outputting a scalar; ∇H computed via jax.grad.
      - B(z)·u is a plain linear layer conditioned on z and u for the control
        input channel (keeps the system actuated).
      - Initialise J and R small to start near deterministic identity dynamics.
      - Do not hardcode latent_dim; read from the existing module attribute.

  - id: spectral_multiscale_drift
    priority: 50
    target_file: dte/models/latent_sde.py
    title: Decompose the latent state into slow and fast sub-spaces with separate drift networks operating at different effective timescales, improving long-horizon accuracy by explicitly separating thermal and reaction modes.
    rationale: >
      Industrial processes span 4–6 orders of magnitude in timescale: jacket
      temperature equilibrates in seconds, composition shifts in minutes, fouling
      evolves over hours. A flat MLP drift must simultaneously represent all
      scales, which is the root cause of stiffness and poor long-horizon rollout.
      Explicit scale separation allows: (a) each drift to focus on its natural
      frequency band, (b) the slow sub-space to provide a stable backbone for
      long-horizon prediction, (c) the fast sub-space to capture control response
      without corrupting steady-state accuracy. The decomposition is learned, not
      hard-wired to system dimensions.
    instructions:
      - Split latent_dim into slow_dim (latent_dim // 2) and fast_dim (remainder).
      - Slow drift: small MLP, output scaled by `slow_scale` initialised to 0.1.
      - Fast drift: existing LatentDrift architecture on the fast sub-space only.
      - Reconstruction uses the concatenation of both sub-spaces as z.
      - The diffusion acts on the fast sub-space only; slow sub-space is
        deterministic (set its diffusion to zero).
      - Keep all conditioning inputs (u, d, params) available to both networks.
      - Make the split ratio a config parameter under `model.slow_dim_fraction`;
        default 0.5.

  - id: neural_cde_drift
    priority: 60
    target_file: dte/models/latent_sde.py
    title: Replace the linear-interpolation control injection with a proper Neural CDE formulation dz = f_θ(z) dX where X=(t,u,d) is the control path and f_θ outputs a matrix multiplying the path derivative.
    rationale: >
      The current approach linearly interpolates controls and evaluates them as
      point values in the drift. This is a numerical approximation that fails for
      piecewise-constant actuator signals (the dominant signal type in real
      plants), which have Dirac-delta path derivatives at switching points. A
      Neural CDE treats control inputs as a rough path and the network as a
      matrix-valued function operating on that path. CDEs are the theoretically
      correct architecture for systems driven by irregular control signals, with
      universal approximation guarantees for controlled dynamical systems.
      For real plant data with irregular sampling and dropouts this difference
      is decisive.
    instructions:
      - f_θ outputs a (latent_dim × path_dim) matrix where path_dim = 1 + control_dim + disturbance_dim.
      - The CDE term is f_θ(z) · dX/dt where dX/dt is the piecewise-constant
        derivative of the linearised control path (compute via jnp.diff on the
        interpolated grid; handle the endpoint carefully).
      - Combine the CDE term additively with the existing autonomous drift f(z)
        so the model gracefully degrades to the current behaviour when controls
        are constant.
      - Keep diffusion unchanged; only the drift integration is affected.
      - Do not increase hidden_dim; use the existing drift architecture for f_θ
        but add a projection layer to reshape output to (latent_dim × path_dim).

  # ── Tier 3: Transformative but multi-file; document here for future manual runs ─

  - id: self_supervised_pretraining
    priority: 70
    target_file: dte/training/trainer.py
    title: Add a self-supervised masked-dynamics pre-training phase before the main SDE training where the encoder+decoder must reconstruct randomly masked timesteps, seeding the representation with physics-consistent interpolation knowledge.
    rationale: >
      Pre-training with masked prediction (analogous to BERT/MAE) teaches the
      encoder a rich physical representation before the hard SDE training begins.
      The model learns causal physical relationships from data alone — if
      temperature rises and flow is constant, concentration must fall — without
      needing labelled physics residuals. This pre-trained representation
      transfers across systems with only a thin SDE head re-trained. It could
      reduce SDE training time by 5–10× and dramatically improve few-shot
      transfer to new systems. The pre-training uses the existing encoder and
      decoder with no architecture changes; only the training loop is extended.
    instructions:
      - Add a `pretraining` block to configs with `enabled`, `n_steps`,
        `mask_fraction` (default 0.4), and `mask_strategy` (random or block).
      - In Trainer.__init__, if pretraining is enabled, run a separate Adam loop
        on reconstruction_loss only over masked subsequences before the main loop.
      - Mask by zeroing out state inputs at selected timesteps; decoder must
        predict those states from the unmasked context via the latent trajectory.
      - Use the mean trajectory (no SDE noise) during pre-training for stability.
      - Do not change encoder, decoder, or latent_sde architectures.

  - id: universal_joint_training
    priority: 80
    target_file: dte/training/trainer.py
    title: Extend the training loop to accept multiple system datasets simultaneously and train a shared latent SDE with system-specific encoder/decoder heads, producing a universal latent dynamics backbone across all registered systems.
    rationale: >
      A model trained jointly on CSTR + heat exchanger data must learn latent
      dynamics that generalise across both systems. If the latent SDE captures
      universal physics concepts (energy flow, mass transport, reaction kinetics)
      rather than CSTR-specific modes, a new system needs only thin encoder/
      decoder heads — all dynamics are already learned. This is the foundational
      model premise: the equivalent of CLIP for physical process systems.
      Negative transfer is the existential risk, but even partial sharing of
      latent dynamics could dramatically reduce data requirements for new systems.
    instructions:
      - Accept a list of (data_dir, system_config) pairs in autoresearch config.
      - Sample batches from each system in round-robin; prefix system id to param
        vector so the encoder can distinguish systems without hardcoded branches.
      - Keep a single shared LatentSDE; use system-specific Encoder and Decoder
        as separate sub-modules keyed by system name.
      - Physics losses are applied per-system using the appropriate PhysicsLoss
        instance from the registry.
      - Do not introduce string-branch logic in dte/models/ for system identity.

  - id: score_based_trajectory_diffusion
    priority: 90
    target_file: dte/models/latent_sde.py
    title: Replace the forward SDE rollout with a denoising diffusion model over entire latent trajectories, conditioning on initial state and controls to sample physically plausible multi-modal trajectory distributions.
    rationale: >
      Diffusion models are the best generative models known. Applied to latent
      trajectories they capture multi-modal distributions that a single SDE path
      cannot — a plant near a bifurcation genuinely has multiple plausible futures.
      Uncertainty quantification becomes exact by sampling many denoised
      trajectories. The denoising network sees the full trajectory as a fixed-
      length tensor, enabling attention across time and eliminating numerical
      issues from stiff ODE solving. This is how foundation models for video work;
      physical trajectories are videos of state evolution.
    instructions:
      - Implement a DDPM-style score network s_θ(z_traj_noisy, noise_level, u, c)
        that denoises a (seq_len × latent_dim) trajectory tensor.
      - Use a 1D temporal UNet or causal transformer backbone conditioned on
        controls and params via cross-attention or FiLM.
      - Replace __call__ (stochastic) with the DDPM reverse chain; keep
        mean_trajectory as the single DDPM denoising pass at noise_level=0.
      - Training loss: MSE on predicted noise (ε-prediction, standard DDPM).
      - Keep the encoder and decoder unchanged; only the dynamics model changes.
      - This idea requires significant testing; flag as experimental and add a
        config key 'sde.mode = diffusion' to activate it.
