  - id: dimensionless_buckingham_pi_frontend
    source: gpt
    priority: 10
    target_file: dte/models/encoder.py
    title: Expand the encoder input with generic dimensionless groups, ratio features, and log-scaled operating quantities derived from SystemSpec normalization so the representation is invariant to units and operating scale.
    rationale: >
      A true foundational model for physical systems should not have to re-learn the
      same dynamics just because variables are expressed in different units or ranges.
      If the encoder sees generic dimensionless structure, it may discover reusable
      physical operators across systems. The risk is that hand-crafted invariances
      erase useful signal and make the latent representation too rigid.
    instructions:
      - Add an optional feature expansion path ahead of the existing encoder stack.
      - Include only generic features that can be derived from normalized states,
        controls, and params without system-specific formulas.
      - Keep the raw normalized inputs in the concatenation so the fallback path
        remains intact.
      - Add config flag model.use_dimensionless_inputs (true/false).
      - Keep parameter count growth modest; avoid feature explosion.

  - id: koopman_linear_drift
    source: claude
    priority: 20
    target_file: dte/models/latent_sde.py
    title: Replace the unstructured MLP drift with a Koopman-style linear map A(u,c)·z + B(u,c)·w so latent dynamics are globally linear at any given operating point.
    rationale: >
      Koopman theory suggests a nonlinear system can become linear in the right
      lifted coordinates. If the encoder learns that embedding, a conditioned
      linear operator plus a small stabilizing path may improve transfer and
      long-horizon behavior across systems.
    instructions:
      - Output A (latent_dim x latent_dim) and B (latent_dim x control_dim) as
        small linear layers conditioned on concatenated (u_norm, d_norm, c_norm).
      - Keep the existing input normalisation pipeline untouched.
      - Preserve residual/skip paths for stability at initialisation.
      - Zero-initialise the off-diagonal part of A; start near identity + small noise.
      - Do not introduce system-specific structure or hardcoded dimensions.

  - id: wasserstein_kl_replacement
    source: claude
    priority: 30
    target_file: dte/training/losses.py
    title: Replace the KL divergence term with a Sinkhorn divergence on mini-batch aggregate posteriors to prevent posterior collapse and enable sharper multi-modal latent structure.
    rationale: >
      KL(q(z|x) || N(0,I)) can collapse the posterior. A lightweight Sinkhorn-style
      aggregate posterior regularizer may keep the latent representation useful
      without forcing every posterior to match the same Gaussian.
    instructions:
      - Implement a bounded-cost Sinkhorn divergence with a modest iteration cap.
      - Accept a sinkhorn_reg config key under loss_weights; fall back to existing KL if absent.
      - Keep the KL annealing schedule plumbing intact; apply it to the Sinkhorn weight as well.
      - Keep compute overhead contained so autoresearch runs remain comparable.

  - id: lagrange_multiplier_physics
    source: claude
    priority: 40
    target_file: dte/training/losses.py
    title: Replace fixed physics loss weights with learned dual variables (Lagrange multipliers) that enforce mass and energy residual constraints via primal-dual updates.
    rationale: >
      Fixed physics weights are a brittle compromise across systems. Learned dual
      variables could adaptively push mass and energy constraints without forcing
      the same scale on every benchmark.
    instructions:
      - Add lambda_mass and lambda_energy as scalar arrays updated in the training loop, not inside the model.
      - Use a conservative dual update and clip the multipliers to prevent runaway growth.
      - Add a physics_constraints config block with dual_lr and constraint_slack.
      - Fall back to the legacy fixed-weight behavior when the block is absent.
      - Keep the physics residual computation path unchanged.

  - id: neural_cde_drift
    source: claude
    priority: 50
    target_file: dte/models/latent_sde.py
    title: Add a Neural CDE-style control path term so the latent drift responds to control and disturbance trajectories, not only pointwise interpolation values.
    rationale: >
      Process controls are often piecewise constant and abrupt. Treating controls
      as a path rather than only point samples may improve how the model handles
      switching behavior and irregular actuation.
    instructions:
      - Add an optional control-path term to the existing autonomous drift rather than replacing it completely.
      - Build the path from time, controls, and disturbances on the existing rollout grid.
      - Use a compact projection to produce a latent_dim x path_dim matrix field.
      - Add a config flag to enable or disable the Neural CDE term.
      - Leave diffusion and decoder behavior unchanged.

  - id: port_hamiltonian_drift
    source: claude
    priority: 60
    target_file: dte/models/latent_sde.py
    title: Restructure LatentDrift as a port-Hamiltonian system dz=(J(z)-R(z))∇H(z)dt + B(z)u dt where J is skew-symmetric and R is positive semi-definite.
    rationale: >
      Dissipativity is common across thermodynamic systems. A port-Hamiltonian
      prior could improve long-horizon stability by baking conservative exchange
      and dissipation structure into the latent dynamics.
    instructions:
      - Parameterise J(z) = W(z) - W(z)^T and R(z) = L(z)^T L(z).
      - Learn a small scalar Hamiltonian H(z) and differentiate it with jax.grad.
      - Keep explicit control and disturbance actuation paths.
      - Add a config flag model.port_hamiltonian with graceful fallback.
      - Initialize structured terms small so training starts near current behavior.

  - id: self_supervised_pretraining
    source: claude
    priority: 70
    target_file: dte/training/trainer.py
    title: Add a masked-dynamics self-supervised pretraining phase before the main SDE training.
    rationale: >
      Masked pretraining may seed a better latent representation before the
      harder rollout objective starts. If it works, it should help all three
      system benchmarks rather than only one.
    instructions:
      - Add a pretraining block to configs with enabled, n_steps, mask_fraction, and mask_strategy.
      - Run a separate Adam loop on reconstruction loss only over masked subsequences before the main loop.
      - Use the mean trajectory during pretraining for stability.
      - Keep the current training flow unchanged when pretraining is disabled.
      - Avoid system-specific logic.
