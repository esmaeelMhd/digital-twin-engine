ideas:

  # ── Tier 1: Feasible within autoresearch harness, single-file changes ──────

  - id: differentiable_simulator_in_the_loop
    priority: 10
    target_file: dte/models/latent_sde.py
    title: Embed the actual JAX-based ProcessSimulator directly inside the Latent SDE's drift function as a hard physical prior, using a neural network only to model the residual unknown dynamics.
    rationale: >
      Instead of dropping the soft PhysicsLoss penalty, embed the actual JAX-based
      ProcessSimulator directly inside the Latent SDE's drift function as a hard
      physical prior. The neural network only models the residual unknown dynamics
      (the "sim2real" gap). This guarantees perfect adherence to known physics by
      design, requiring vastly less data to train the neural residual.
    instructions:
      - Modify LatentDrift to accept the ProcessSimulator instance or its equations.
      - Compute the physical drift using the simulator equations.
      - Add the neural network output as a residual on top of the physical drift.
      - Be careful with stiff numerical simulator backpropagation.

  - id: adversarial_physics_violators
    priority: 20
    target_file: dte/training/trainer.py
    title: Train a secondary "Physics Critic" network that actively searches the latent space for trajectories that violate physical laws, while the SDE generator tries to fool it.
    rationale: >
      Instead of computing a static MSE on the physics residuals, train a secondary
      "Physics Critic" network. This critic actively searches the latent space for
      trajectories that violate physical laws, while the SDE generator tries to fool
      it by producing perfectly physical trajectories. The model learns to anticipate
      and correct edge-case physical violations that a static loss function would never
      sample, leading to unprecedented long-term rollout stability.
    instructions:
      - Add a Physics Critic MLP that takes a latent trajectory and predicts physics violation.
      - Update the training loop to alternate between training the Critic (to maximize violation detection)
        and the SDE (to minimize the Critic's score).
      - Ensure the min-max optimization is stable, perhaps using gradient penalties.

  - id: meta_learning_sde_solver
    priority: 30
    target_file: dte/models/latent_sde.py
    title: Use meta-learning to train a lightweight neural network to be the SDE solver, optimized specifically for the stiff dynamics of industrial processes.
    rationale: >
      Instead of using standard Diffrax solvers (Euler, Milstein, etc.), use meta-learning
      to train a lightweight neural network to be the SDE solver. Optimize this neural solver
      specifically for the stiff dynamics of industrial processes. This could speed up inference
      and MPC rollouts by 100x, allowing for real-time control of massively complex systems that
      currently require too many integration steps.
    instructions:
      - Replace the Diffrax solver with a custom neural solver module.
      - Train the neural solver to match the output of a high-fidelity Diffrax solver on a
        meta-dataset of trajectories.
      - Use the trained neural solver during the main SDE training.

  # ── Tier 2: Structural changes, higher reward, higher risk ─────────────────

  - id: universal_cross_system_latent_space
    priority: 40
    target_file: dte/models/latent_sde.py
    title: Train a single massive Encoder/Decoder/SDE that takes the SystemSpec as a conditioning input, making the latent space a universal representation of physical dynamics.
    rationale: >
      Instead of training one model per SystemSpec, train a single massive Encoder/Decoder/SDE
      that takes the SystemSpec (or a graph representation of the physical system's topology) as a
      conditioning input. The latent space becomes a universal representation of physical dynamics.
      You could achieve zero-shot transfer to entirely new physical systems just by passing a new SystemSpec.
    instructions:
      - Modify the models to accept SystemSpec embeddings as conditioning inputs (via FiLM or concatenation).
      - Ensure the latent space dimension is fixed and large enough to accommodate different systems.
      - Train jointly on datasets from multiple systems (e.g., CSTR and Heat Exchanger).

  - id: quantum_inspired_hamiltonian_sde
    priority: 50
    target_file: dte/models/latent_sde.py
    title: Constrain the latent SDE drift and diffusion terms to strictly obey Hamiltonian or Lagrangian mechanics (symplectic structures), enforcing energy conservation topologically.
    rationale: >
      Constrain the latent SDE drift and diffusion terms to strictly obey Hamiltonian or Lagrangian
      mechanics (symplectic structures), enforcing energy conservation topologically rather than via
      a loss penalty. This guarantees perfect energy conservation by architectural design. The model
      would never drift into physically impossible high-energy states during long horizon MPC rollouts.
    instructions:
      - Parameterize the drift as a Hamiltonian vector field.
      - Use symplectic integrators if possible, or enforce the symplectic structure in the drift MLP.
      - Account for dissipation (since industrial systems are open) using a Port-Hamiltonian approach.

  - id: topologically_constrained_latent_manifolds
    priority: 60
    target_file: dte/models/latent_sde.py
    title: Force the latent space to exist on a specific non-Euclidean manifold that naturally encodes the bounded invariants of the physical system.
    rationale: >
      Force the latent space to exist on a specific non-Euclidean manifold (e.g., a hypersphere,
      torus, or hyperbolic space) that naturally encodes the bounded invariants of the physical
      system (e.g., mass fractions must sum to 1, temperatures must be > 0). This eliminates
      out-of-bounds physical predictions entirely.
    instructions:
      - Use Riemannian SDEs or project the latent state onto the manifold at each step.
      - Modify the Encoder to output distributions on the manifold (e.g., von Mises-Fisher).
      - Ensure the Decoder respects the manifold structure.

  - id: continuous_time_rl_self_correcting
    priority: 70
    target_file: dte/models/latent_sde.py
    title: Embed an RL agent inside the SDE integration loop to apply a dynamic "correction" vector to the drift to minimize anticipated physics loss.
    rationale: >
      Embed an RL agent inside the SDE integration loop. At each integration step, the RL agent
      applies a dynamic "correction" vector to the drift to minimize the anticipated physics loss
      of the future trajectory. This creates "self-healing" digital twins. Even if the base SDE
      drifts, the internal RL agent actively steers the trajectory back onto the physical manifold.
    instructions:
      - Add a small RL policy network that takes the current state and outputs a drift correction.
      - Train the policy using a continuous-time RL algorithm or via differentiable MPC.
      - Add the correction to the main drift before integration.

  # ── Tier 3: Transformative but multi-file; document here for future manual runs ─

  - id: infinite_dimensional_latent_spaces
    priority: 80
    target_file: dte/models/latent_sde.py
    title: Replace the finite-dimensional latent vector with a stochastic Fourier Neural Operator (FNO) or PDE-based latent space.
    rationale: >
      Replace the finite-dimensional latent vector with a stochastic Fourier Neural Operator (FNO)
      or PDE-based latent space. The SDE operates on continuous function spaces rather than discrete
      vectors. This allows the engine to scale natively to distributed parameter systems (e.g., 3D
      fluid dynamics, spatial temperature gradients in reactors) without changing the architecture.
    instructions:
      - Implement an FNO-based drift function.
      - Modify the latent state to be a grid of values representing a continuous function.
      - Use spectral methods for integration.

  - id: multi_modal_physical_grounding
    priority: 90
    target_file: dte/models/latent_sde.py
    title: Add a text encoder to the architecture and condition the LatentSDE on textual descriptions of the system state, maintenance logs, or operating procedures.
    rationale: >
      Add a text encoder (e.g., a frozen LLM or CLIP-style model) to the architecture. Condition
      the LatentSDE on textual descriptions of the system state, maintenance logs, or operating
      procedures. This creates a true multi-modal foundational model for industry. Operators could
      query the digital twin using natural language.
    instructions:
      - Integrate a frozen text encoder (e.g., from HuggingFace).
      - Pass text embeddings as additional conditioning to the Encoder, Decoder, and Drift networks.
      - Train on paired data of trajectories and textual descriptions (if available, or synthesize them).

  - id: llm_driven_symbolic_physics_discovery
    priority: 100
    target_file: dte/training/trainer.py
    title: Periodically pause training and use an LLM or symbolic regression to analyze latent SDE trajectories and extract explicit stochastic differential equations.
    rationale: >
      During the autoresearch loop, periodically pause training and use an LLM (or symbolic regression)
      to analyze the latent SDE trajectories. Have the LLM attempt to extract explicit, human-readable
      stochastic differential equations from the latent space, and then use those explicit equations
      as a prior for the next phase of training. This solves the "black box" problem of neural networks.
    instructions:
      - Add a callback in the training loop to extract latent trajectories.
      - Call an LLM API or symbolic regression library to fit equations to the trajectories.
      - Parse the equations back into JAX code and use them as a regularizer or hard prior for the drift.
