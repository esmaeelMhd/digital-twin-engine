# Smoke universal config for Phase 1 base systems plus first regime variants.

model:
  family: universal_backbone
  latent_dim: 24
  shared_hidden_dim: 64
  system_embedding_dim: 24
  state_group_token_dim: 48
  state_group_kind_dim: 12
  state_group_encoder_layers: 2
  state_group_coupling_layers: 2
  encoder_layers: 2
  decoder_layers: 2
  drift_layers: 2
  use_system_spec_embedding: true
  use_variational_encoder: true
  adapters:
    enabled: true
    bottleneck_dim: 12
    residual_scale: 0.1
    encoder: true
    drift: true
    decoder: true
  neural_cde:
    enabled: true
    hidden_dim: 32
    n_layers: 2

training:
  batch_size: 64
  seq_len: 32
  stride: 8
  val_split: 0.2
  n_epochs: 3
  mixed_batching: weighted
  max_batches_per_epoch: 8

loss_weights:
  reconstruction: 1.0
  trajectory: 1.0
  one_step: 0.5
  k_step: 0.0
  kl: 0.0001
  state_bounds: 0.0
  positivity: 0.0

multi_horizon:
  k_steps: [2, 3]

optimizer:
  peak_lr: 0.0005
  end_lr: 0.00001
  warmup_steps: 10
  total_steps: 200
  gradient_clip: 1.0

checkpointing:
  val_every: 1
  save_every: 1
  max_val_batches: 2

data:
  systems:
    - name: cstr
      system_config: configs/cstr_default.yaml
      data_dir: data/phase1_regime_smoke/cstr/
      weight: 1.0
    - name: cstr_fast_kinetics
      system_config: configs/cstr_fast_kinetics_hot_feed.yaml
      data_dir: data/phase1_regime_smoke/cstr_fast_kinetics/
      weight: 1.0
    - name: isothermal_cstr
      system_config: configs/isothermal_cstr_default.yaml
      data_dir: data/phase1_regime_smoke/isothermal_cstr/
      weight: 1.0
    - name: isothermal_cstr_slow_kinetics
      system_config: configs/isothermal_cstr_slow_kinetics.yaml
      data_dir: data/phase1_regime_smoke/isothermal_cstr_slow_kinetics/
      weight: 1.0
    - name: heat_exchanger
      system_config: configs/heat_exchanger_default.yaml
      data_dir: data/phase1_regime_smoke/heat_exchanger/
      weight: 1.0
    - name: heat_exchanger_high_ua
      system_config: configs/heat_exchanger_high_ua.yaml
      data_dir: data/phase1_regime_smoke/heat_exchanger_high_ua/
      weight: 1.0
    - name: two_tank
      system_config: configs/two_tank_default.yaml
      data_dir: data/phase1_regime_smoke/two_tank/
      weight: 1.0
    - name: two_tank_high_throughput
      system_config: configs/two_tank_high_throughput.yaml
      data_dir: data/phase1_regime_smoke/two_tank_high_throughput/
      weight: 1.0
    - name: storage_tank
      system_config: configs/storage_tank_default.yaml
      data_dir: data/phase1_regime_smoke/storage_tank/
      weight: 1.0
    - name: storage_tank_high_holdup
      system_config: configs/storage_tank_high_holdup.yaml
      data_dir: data/phase1_regime_smoke/storage_tank_high_holdup/
      weight: 1.0
    - name: separator
      system_config: configs/separator_default.yaml
      data_dir: data/phase1_regime_smoke/separator/
      weight: 1.0
    - name: separator_sharp_split
      system_config: configs/separator_sharp_split.yaml
      data_dir: data/phase1_regime_smoke/separator_sharp_split/
      weight: 1.0
    - name: bioreactor_compartment
      system_config: configs/bioreactor_compartment_default.yaml
      data_dir: data/phase1_regime_smoke/bioreactor_compartment/
      weight: 1.0
    - name: bioreactor_compartment_high_transfer
      system_config: configs/bioreactor_compartment_high_transfer.yaml
      data_dir: data/phase1_regime_smoke/bioreactor_compartment_high_transfer/
      weight: 1.0

evaluation:
  per_system_batches: 2
  aggregate_method: geometric_mean
  metric_name: geometric_mean_per_system_total_loss
  uncertainty_samples: 4
  uncertainty_batches: 1
  sensitivity_batches: 1
