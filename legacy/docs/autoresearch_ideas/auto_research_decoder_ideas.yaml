ideas:
  - id: decoder_constraint_aware_residual_head
    priority: 10
    target_file: dte/models/unit/decoder.py
    title: Split decoding into a stable baseline prediction plus a small constraint-aware residual correction applied before final output constraints.
    rationale: The overnight baseline-plus-correction try did not explicitly focus on constraint-friendly structure.
    instructions:
      - Keep the correction branch conservative at initialization.
      - Preserve the existing generic constraint application path.

  - id: decoder_latent_subspace_branches
    priority: 20
    target_file: dte/models/unit/decoder.py
    title: Decode through two latent subspace branches and fuse them late so different latent factors can specialize before reconstruction.
    rationale: This is an untried way to improve latent-to-physical coupling without resorting to bigger MLPs.
    instructions:
      - Keep the branch count small.
      - Avoid system-specific channel splitting.

  - id: decoder_context_to_output_affine_modulation
    priority: 30
    target_file: dte/models/unit/decoder.py
    title: Modulate the final pre-constraint activations with an affine context transform from controls and params instead of only modulating hidden layers.
    rationale: FiLM in the hidden stack failed, but output-side conditioning remains untested.
    instructions:
      - Apply modulation right before the state heads.
      - Keep the transform simple and stable.

  - id: decoder_transient_vs_steady_gate
    priority: 40
    target_file: dte/models/unit/decoder.py
    title: Add a small transient-versus-steady gating pathway that chooses between two decoder corrections based on latent and context features.
    rationale: A decoder may need different correction behavior in calm versus rapidly changing regimes.
    instructions:
      - Start with one shared baseline plus two small corrections.
      - Keep parameter growth modest.

  - id: decoder_skip_to_constrained_heads
    priority: 50
    target_file: dte/models/unit/decoder.py
    title: Add a direct skip from the raw latent-context input to the final state heads so easy physical mappings are preserved while the deep path handles only hard corrections.
    rationale: The decoder may benefit from a stronger linear route than the overnight attempts explored.
    instructions:
      - Keep the deep path intact.
      - Preserve compatibility with the constraint layer.
