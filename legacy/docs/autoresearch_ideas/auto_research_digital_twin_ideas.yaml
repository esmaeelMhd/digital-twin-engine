ideas:
  - id: digital_twin_regime_aware_latent_prior
    priority: 10
    target_file: dte/models/unit/digital_twin.py
    title: Add a regime-aware latent prior or initialization adjustment conditioned on controls and params before rollout begins.
    rationale: This is still the most important untried model-level idea from the roadmap.
    instructions:
      - Keep it generic across systems.
      - Avoid turning the prior into a large standalone network.

  - id: digital_twin_context_conditioned_mean_sample_gate
    priority: 20
    target_file: dte/models/unit/digital_twin.py
    title: Replace fixed latent blending with a learned context-conditioned gate that decides when to trust z_mean versus a stochastic sample.
    rationale: Mean/sample blending won once, but the adaptive variance-based version was weak; a context-driven gate is still untried.
    instructions:
      - Condition on encoded uncertainty and operating context if available.
      - Bias toward conservative behavior initially.

  - id: digital_twin_uncertainty_tempered_sampling
    priority: 30
    target_file: dte/models/unit/digital_twin.py
    title: Temper latent sampling by learned uncertainty scaling so extremely noisy samples are softened without collapsing stochasticity.
    rationale: This is a model-level way to stabilize rollout initialization while keeping uncertainty alive.
    instructions:
      - Keep the transformation simple and bounded.
      - Do not hardcode per-system heuristics.

  - id: digital_twin_dual_init_path
    priority: 40
    target_file: dte/models/unit/digital_twin.py
    title: Create two initialization paths, one deterministic and one stochastic, and combine them through a small shared gate before rollout.
    rationale: The encoder-rollout interface may need more explicit structure than a single blend scalar.
    instructions:
      - Reuse existing encoded statistics where possible.
      - Keep the new coupling local to DigitalTwin.

  - id: digital_twin_context_residual_init
    priority: 50
    target_file: dte/models/unit/digital_twin.py
    title: Predict a small context-dependent residual adjustment to the initial latent state after encoding and before rollout.
    rationale: This can reduce mismatch between the encoder manifold and the rollout regime without changing the encoder or SDE directly.
    instructions:
      - Initialize the residual path near zero.
      - Keep the base encoded latent state clearly visible in the final formula.
