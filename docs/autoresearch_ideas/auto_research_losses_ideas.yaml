ideas:
  - id: losses_derivative_confidence_weighting
    priority: 10
    target_file: dte/training/shared/losses.py
    title: Weight derivative-matching errors by local trajectory variability so sharp transients matter more than quiet steady-state regions.
    rationale: Derivative matching already won; the next step is to make that signal more selective and less noisy.
    instructions:
      - Build on the existing derivative-aware idea instead of replacing it entirely.
      - Keep weighting generic and data-driven.

  - id: losses_one_step_rollout_consistency
    priority: 20
    target_file: dte/training/shared/losses.py
    title: Add an explicit consistency term between one-step prediction quality and multi-step rollout quality so local and long-horizon objectives stop fighting each other.
    rationale: The repo already mixes local and rollout supervision, but not with a structured consistency objective.
    instructions:
      - Prefer a mathematically interpretable penalty.
      - Avoid pure scalar weight tuning.

  - id: losses_frequency_domain_temporal_loss
    priority: 30
    target_file: dte/training/shared/losses.py
    title: Add a lightweight frequency-domain or smoothed spectral consistency loss to preserve oscillatory and slow-trend dynamics across horizons.
    rationale: Industrial trajectories can differ in temporal character even when pointwise losses look similar.
    instructions:
      - Keep it numerically stable and efficient.
      - Do not rely on system-specific frequencies.

  - id: losses_adaptive_physics_residual_balancing
    priority: 40
    target_file: dte/training/shared/losses.py
    title: Aggregate physics residuals with adaptive normalization so one large residual channel cannot dominate the whole physics penalty.
    rationale: This changes the structure of the objective rather than merely retuning scalar weights.
    instructions:
      - Stay generic across physics modules.
      - Use statistics or normalization that can be computed from the residual tensors directly.

  - id: losses_integral_trajectory_consistency
    priority: 50
    target_file: dte/training/shared/losses.py
    title: Add integral consistency over windows so accumulated trajectory drift is penalized even when instantaneous errors cancel out.
    rationale: Windowed integral error can capture long-horizon drift that pointwise and derivative losses both miss.
    instructions:
      - Keep window sizes small and generic.
      - Complement the existing trajectory loss rather than duplicating it.

  - id: losses_transient_emphasis_schedule
    priority: 60
    target_file: dte/training/shared/losses.py
    title: Emphasize timesteps with large local change by redistributing trajectory loss mass toward transients instead of treating every timestep equally.
    rationale: Process control performance often depends more on transient fidelity than on easy steady-state segments.
    instructions:
      - Base the emphasis on observed temporal change, not hand-written state rules.
      - Keep the total loss scale well behaved.
