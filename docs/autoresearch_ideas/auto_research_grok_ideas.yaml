ideas:

  # ── Tier 1: Feasible within autoresearch harness, single-file changes ──────

  - id: universal_systemspec_conditioned_backbone
    priority: 10
    target_file: dte/models/unit/latent_sde.py
    title: Make LatentSDE take tokenized/embedded SystemSpec as conditioning input via cross-attention or FiLM for a universal latent dynamics backbone.
    rationale: >
      Instead of training one model per SystemSpec, make the core LatentSDE (and optionally
      encoder/decoder) condition on a rich embedding of the full SystemSpec. This creates
      a single shared backbone that learns universal physics operators across systems.
      New systems would only require thin system-specific heads. This is the true
      foundational model vision.
    instructions:
      - Add SystemSpec embedding pathway (state/control/disturbance dims, constraints,
        normalization stats, state names).
      - Use FiLM, cross-attention, or learned embeddings for conditioning.
      - Keep all existing SystemSpec-driven initialization paths intact.
      - Support joint training across multiple systems when enabled.
      - Add config key model.use_system_conditioning (true/false) with graceful fallback
        to current behavior.
      - Do not introduce system-specific branches in model code.

  - id: port_hamiltonian_neural_sde
    priority: 20
    target_file: dte/models/unit/latent_sde.py
    title: Restructure LatentDrift as a port-Hamiltonian system dz=(J(z)-R(z))∇H(z)dt + B(z)u dt with learned Hamiltonian.
    rationale: >
      Industrial processes are fundamentally dissipative thermodynamic systems.
      Port-Hamiltonian structure bakes passivity and energy conservation into the
      architecture rather than relying on loss penalties. J captures reversible
      energy exchange between latent modes; R captures irreversible dissipation.
      This inductive bias should generalize across CSTRs, heat exchangers, reactors,
      and other process systems.
    instructions:
      - Parameterize J(z) as skew-symmetric matrix (W(z) - W(z)ᵀ).
      - Parameterize R(z) as positive semi-definite (L(z)ᵀL(z)).
      - Learn scalar Hamiltonian H(z) and use jax.grad to compute ∇H.
      - Keep existing control, disturbance, and parameter conditioning.
      - Add config flag model.port_hamiltonian (true/false) with fallback to standard MLP drift.
      - Initialise J and R small to preserve existing behavior at start of training.

  - id: trajectory_level_score_based_diffusion
    priority: 30
    target_file: dte/models/unit/latent_sde.py
    title: Replace forward SDE rollout with denoising diffusion model over full latent trajectories conditioned on initial state and controls.
    rationale: >
      Diffusion models excel at capturing multi-modal distributions. Applied to
      latent trajectories, they can model bifurcations and distinct operating regimes
      that a single SDE path cannot represent. This enables exact uncertainty
      quantification via sampling and eliminates many stiff ODE numerical issues.
    instructions:
      - Implement DDPM-style or flow-matching score network over (seq_len, latent_dim) tensors.
      - Use 1D temporal UNet or causal transformer backbone with cross-attention
        for controls/params conditioning.
      - Add config key sde.mode (sde or diffusion) to switch between SDE and diffusion modes.
      - Keep encoder and decoder unchanged; only dynamics model is affected.
      - Training loss should be standard noise prediction (ε-prediction).

  - id: differentiable_simulator_residual
    priority: 40
    target_file: dte/models/unit/latent_sde.py
    title: Embed ProcessSimulator inside LatentDrift as hard physical prior, with neural network modeling only the residual (sim2real gap).
    rationale: >
      Instead of soft PhysicsLoss penalties, directly use the differentiable
      ProcessSimulator equations as the base drift and let the neural network
      only learn the mismatch. This provides hard physics guarantees and should
      dramatically reduce data requirements.
    instructions:
      - Modify LatentDrift to optionally accept a ProcessSimulator instance.
      - Compute base physical drift using simulator.step or equivalent.
      - Add neural residual on top of the physical prediction.
      - Add config key model.use_simulator_prior (true/false).
      - Handle gradient flow carefully through the simulator.

  # ── Tier 2: Structural changes, higher reward, higher risk ─────────────────

  - id: manifold_constrained_latent_space
    priority: 50
    target_file: dte/models/unit/latent_sde.py
    title: Force latent space onto geometry that encodes physical invariants (hypersphere, hyperbolic, etc.).
    rationale: >
      Many physical invariants (mass fractions summing to 1, positivity constraints)
      map naturally to specific manifolds. Constraining the latent space to live on
      these geometries prevents unphysical predictions by construction.
    instructions:
      - Implement manifold projection or use Riemannian SDE formulation.
      - Modify encoder to output appropriate distributions (e.g. von Mises-Fisher).
      - Update decoder and loss computation to respect manifold structure.
      - Add config parameters for manifold type and curvature.

  - id: neural_cde_koopman_hybrid
    priority: 60
    target_file: dte/models/unit/latent_sde.py
    title: Combine Neural CDE for irregular control signals with Koopman-style linear latent dynamics.
    rationale: >
      Plant control signals are often piecewise constant. Neural CDEs provide the
      theoretically correct treatment of such rough paths. Combining with Koopman
      linear maps enables analytical prediction and convex MPC formulations.
    instructions:
      - Implement Neural CDE formulation for control path integration.
      - Add low-rank or linear Koopman component in latent space.
      - Maintain backward compatibility with existing linear interpolation approach.
      - Add appropriate config flags to enable each component independently.

  - id: self_supervised_masked_pretraining
    priority: 70
    target_file: dte/training/unit/trainer.py
    title: Add masked dynamics pretraining phase before SDE training across multiple systems.
    rationale: >
      Self-supervised pretraining teaches the encoder/decoder rich causal physical
      relationships from data alone. This should provide a strong initialization
      for the harder SDE training phase and improve cross-system transfer.
    instructions:
      - Add pretraining phase with random or block masking of states/controls.
      - Support joint training over multiple system datasets.
      - Use reconstruction loss only during pretraining phase.
      - Add comprehensive config block under `pretraining`.

  # ── Tier 3: Transformative but multi-file; document here for future manual runs ─

  - id: multi_modal_text_grounding
    priority: 80
    target_file: dte/models/unit/latent_sde.py
    title: Add text encoder and condition LatentSDE on natural language descriptions and maintenance logs.
    rationale: >
      Create a true multi-modal foundational model. Operators could provide textual
      context ("heat exchanger is fouling", "catalyst deactivation observed") and
      the model would adapt its dynamics accordingly.
    instructions:
      - Integrate a text encoder (frozen or lightweight).
      - Add text embeddings as conditioning to encoder, decoder, and SDE.
      - Requires paired text+trajectory data or synthetic generation.
      - Major architectural change - document carefully.

  - id: meta_learned_adaptive_solver
    priority: 90
    target_file: dte/training/unit/trainer.py
    title: Meta-learn an adaptive SDE solver or correction network specialized for industrial stiffness patterns.
    rationale: >
      Instead of fixed Diffrax solvers, learn a neural solver or correction term
      optimized specifically for the dynamics of process systems. Could enable
      much longer stable horizons and faster inference.
    instructions:
      - Implement meta-learning loop or lightweight neural corrector inside integration.
      - Train on meta-dataset of trajectories from multiple systems.
      - Significant changes to training loop and integration logic.

  - id: llm_symbolic_physics_discovery
    priority: 100
    target_file: dte/training/unit/trainer.py
    title: Periodic LLM-driven symbolic equation discovery from latent trajectories during autoresearch.
    rationale: >
      Use LLMs or symbolic regression to extract human-readable SDEs from the learned
      latent dynamics, then distill these equations back as priors or regularizers.
      Bridges neural black-box to interpretable physics.
    instructions:
      - Add periodic callback during training to sample trajectories.
      - Interface with LLM/symbolic regression to discover equations.
      - Parse and inject discovered equations as additional loss or hard constraint.
      - Highly experimental - requires external LLM API access.
