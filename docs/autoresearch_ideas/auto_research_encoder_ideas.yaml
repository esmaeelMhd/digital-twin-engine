ideas:
  - id: encoder_gated_context_branch
    priority: 10
    target_file: dte/models/encoder.py
    title: Add a gated control-and-parameter context branch that can selectively modulate latent inference instead of always mixing context linearly.
    rationale: FiLM worked; a more selective context pathway is the next natural untried step.
    instructions:
      - Keep the gate lightweight.
      - Preserve the existing generic state-conditioning path.

  - id: encoder_uncertainty_stabilized_logvar_head
    priority: 20
    target_file: dte/models/encoder.py
    title: Reparameterize the log-variance head with a stabilizing offset or bounded pre-activation so posterior uncertainty stays expressive without exploding.
    rationale: Posterior geometry improvements remain mostly untested in this campaign.
    instructions:
      - Do not hardcode system-specific scales.
      - Preserve diagonal-latent semantics.

  - id: encoder_context_summary_skip
    priority: 30
    target_file: dte/models/encoder.py
    title: Build a compact learned context summary from controls and params and concatenate it to the final posterior heads as a dedicated skip pathway.
    rationale: This is different from the overnight global state skip and focuses specifically on operating context.
    instructions:
      - Keep the summary small.
      - Reuse it for both mean and logvar if possible.

  - id: encoder_state_context_cross_gate
    priority: 40
    target_file: dte/models/encoder.py
    title: Let the physical-state pathway gate how much control/parameter context enters each hidden block, producing regime-aware inference.
    rationale: Context relevance should depend on the current physical state, not be globally fixed.
    instructions:
      - Implement gating with minimal added depth.
      - Avoid introducing a separate large attention-style subsystem.

  - id: encoder_noisy_observation_residual_path
    priority: 50
    target_file: dte/models/encoder.py
    title: Add a robust residual path that preserves a direct low-distortion view of the normalized state for latent inference under noisy observations.
    rationale: Robust latent inference remains largely untested despite its importance for industrial use.
    instructions:
      - Keep the path generic and always active.
      - Do not depend on data-pipeline masking changes.
