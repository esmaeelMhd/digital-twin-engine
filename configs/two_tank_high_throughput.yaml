system:
  name: two_tank
  unit_type: coupled_tanks
  family: hydraulic
  subtype: high_throughput_two_tank
  law_tags: [mass_balance, gravity_flow]
  conditioning_tags:
    reaction_class: none
    thermo_regime: incompressible_isothermal
    bio_model_family: none
    operating_regime: high_throughput
  state_names: [h1, h2]
  state_groups:
    - name: levels
      kind: inventory
      indices: [0, 1]
  state_channels:
    - name: h1
      role: inventory
      unit: m
      lower_bound: 0.0
      upper_bound: 5.0
      conserved_group: levels
    - name: h2
      role: inventory
      unit: m
      lower_bound: 0.0
      upper_bound: 5.0
      conserved_group: levels
  control_names: [q_in, valve]
  control_channels:
    - name: q_in
      role: flow
      unit: m^3/min
      lower_bound: 0.6
      upper_bound: 1.3
    - name: valve
      role: actuator_state
      lower_bound: 0.8
      upper_bound: 1.0
  disturbance_names: [d1, d2]
  disturbance_channels:
    - name: d1
      role: flow
      unit: m^3/min
      lower_bound: 0.03
      upper_bound: 0.15
    - name: d2
      role: flow
      unit: m^3/min
      lower_bound: 0.0
      upper_bound: 0.08
  parameter_descriptors:
    - name: A1
      unit: m^2
      law_tag: geometry
    - name: A2
      unit: m^2
      law_tag: geometry
    - name: k12
      unit: m^2.5/min
      law_tag: hydraulics
    - name: kout
      unit: m^2.5/min
      law_tag: hydraulics
    - name: h_max
      unit: m
      law_tag: constraints
  normalization:
    state_center: [1.8, 1.3]
    state_scale: [0.5, 0.5]
    control_center: [0.95, 0.9]
    control_scale: [1.0, 1.5]
    disturbance_center: [0.09, 0.04]
    disturbance_scale: [2.0, 4.0]
    param_scale: 0.1
  decoder_constraints:
    - type: sigmoid_range
      indices: [0, 1]
      low: 0.0
      high: 5.0

two_tank:
  A1: 1.3
  A2: 1.0
  k12: 1.1
  kout: 1.2
  h_max: 5.0

simulation:
  dt: 0.1
  t_span: [0.0, 100.0]

data_generation:
  control_signals:
    q_in:
      type: prbs
      switch_prob: 0.05
    valve:
      type: prbs
      switch_prob: 0.05
  disturbance_signals:
    d1:
      type: multistep
      n_changes: 5
    d2:
      type: multistep
      n_changes: 5

initial_conditions:
  h1: 2.0
  h2: 1.3

operating_ranges:
  q_in: [0.6, 1.3]
  valve: [0.8, 1.0]
  d1: [0.03, 0.15]
  d2: [0.0, 0.08]
