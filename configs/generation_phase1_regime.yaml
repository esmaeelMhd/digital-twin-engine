# Moderate-size Phase 1 regime corpus for the first non-smoke universal run.
# This expands the 14-system regime mix beyond the smoke corpus without jumping
# straight to an expensive long-horizon foundation-scale dataset.

seed: 42

defaults:
  n_trajectories: 256
  n_steps: 96
  simulation_mode: dataset
  output_root: data/phase1_regime

systems:
  - name: cstr
    system_config: configs/cstr_default.yaml
    output_dir: data/phase1_regime/cstr
  - name: cstr_fast_kinetics
    system_config: configs/cstr_fast_kinetics_hot_feed.yaml
    output_dir: data/phase1_regime/cstr_fast_kinetics
  - name: isothermal_cstr
    system_config: configs/isothermal_cstr_default.yaml
    output_dir: data/phase1_regime/isothermal_cstr
  - name: isothermal_cstr_slow_kinetics
    system_config: configs/isothermal_cstr_slow_kinetics.yaml
    output_dir: data/phase1_regime/isothermal_cstr_slow_kinetics
  - name: heat_exchanger
    system_config: configs/heat_exchanger_default.yaml
    output_dir: data/phase1_regime/heat_exchanger
  - name: heat_exchanger_high_ua
    system_config: configs/heat_exchanger_high_ua.yaml
    output_dir: data/phase1_regime/heat_exchanger_high_ua
  - name: two_tank
    system_config: configs/two_tank_default.yaml
    output_dir: data/phase1_regime/two_tank
  - name: two_tank_high_throughput
    system_config: configs/two_tank_high_throughput.yaml
    output_dir: data/phase1_regime/two_tank_high_throughput
  - name: storage_tank
    system_config: configs/storage_tank_default.yaml
    output_dir: data/phase1_regime/storage_tank
  - name: storage_tank_high_holdup
    system_config: configs/storage_tank_high_holdup.yaml
    output_dir: data/phase1_regime/storage_tank_high_holdup
  - name: separator
    system_config: configs/separator_default.yaml
    output_dir: data/phase1_regime/separator
  - name: separator_sharp_split
    system_config: configs/separator_sharp_split.yaml
    output_dir: data/phase1_regime/separator_sharp_split
  - name: bioreactor_compartment
    system_config: configs/bioreactor_compartment_default.yaml
    output_dir: data/phase1_regime/bioreactor_compartment
  - name: bioreactor_compartment_high_transfer
    system_config: configs/bioreactor_compartment_high_transfer.yaml
    output_dir: data/phase1_regime/bioreactor_compartment_high_transfer
