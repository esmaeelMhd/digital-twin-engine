# Manifest for building the broadened synthetic Phase 1 unit corpus.

seed: 42

defaults:
  n_trajectories: 1000
  n_steps: 500
  simulation_mode: dataset
  output_root: data

systems:
  - name: cstr
    system_config: configs/cstr_default.yaml
    output_dir: data/cstr
  - name: isothermal_cstr
    system_config: configs/isothermal_cstr_default.yaml
    output_dir: data/isothermal_cstr
  - name: heat_exchanger
    system_config: configs/heat_exchanger_default.yaml
    output_dir: data/heat_exchanger
  - name: two_tank
    system_config: configs/two_tank_default.yaml
    output_dir: data/two_tank
  - name: storage_tank
    system_config: configs/storage_tank_default.yaml
    output_dir: data/storage_tank
  - name: separator
    system_config: configs/separator_default.yaml
    output_dir: data/separator
  - name: bioreactor_compartment
    system_config: configs/bioreactor_compartment_default.yaml
    output_dir: data/bioreactor_compartment
