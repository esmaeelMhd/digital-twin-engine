model:
  latent_dim: 16
  hidden_dim: 128
  n_layers: 3
  drift_layers: 3
  diffusion_layers: 2
  diffusion_hidden_dim: 64
  initial_diffusion_scale: 0.1
  state_dim: 4
  param_dim: 6
  control_dim: 2

sde:
  solver: "euler_heun"
  dt_ratio: 0.5

training:
  n_epochs: 100
  batch_size: 64
  max_batches_per_epoch: 64
  seq_len: 20
  stride: 10
  val_split: 0.2

optimizer:
  peak_lr: 3.0e-4
  warmup_steps: 500
  total_steps: 50000
  end_lr: 1.0e-6
  gradient_clip: 0.5

loss_weights:
  reconstruction: 1.0
  kl: 0.001
  trajectory: 10.0
  mass_balance: 0.1
  energy_balance: 0.1

kl_annealing:
  start_weight: 0.0
  end_weight: 0.001
  anneal_steps: 5000

checkpointing:
  save_every: 10
  save_best: true
  output_dir: outputs/
