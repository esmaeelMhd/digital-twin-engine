model:
  latent_dim: 32
  hidden_dim: 128
  n_layers: 3
  drift_layers: 3
  diffusion_layers: 2
  diffusion_hidden_dim: 64
  initial_diffusion_scale: 0.1
  simulator_prior:
    enabled: true
    weight: 1.0
    residual_weight: 0.25
    hard_residual_only: true
  learned_solver:
    enabled: true
    hidden_dim: 64
    n_layers: 2
  self_correcting_policy:
    enabled: true
    weight: 0.05
    hidden_dim: 64
    n_layers: 2
  neural_cde:
    enabled: true
  grouped_encoder:
    enabled: false
    group_token_dim: 64
    group_kind_dim: 8
    group_encoder_layers: 2
    group_mixer_layers: 2
  channel_conditioning:
    enabled: false
  law_conditioning:
    enabled: false
  state_dim: 4
  param_dim: 6
  control_dim: 2
  disturbance_dim: 2

sde:
  solver: "euler_heun"
  dt_ratio: 0.25

training:
  n_epochs: 100
  batch_size: 128
  max_batches_per_epoch: 64
  seq_len: 25
  stride: 5
  val_split: 0.2

optimizer:
  peak_lr: 5.0e-4
  warmup_steps: 200
  total_steps: 5000
  end_lr: 1.0e-6
  gradient_clip: 0.5

loss_weights:
  reconstruction: 1.0
  kl: 0.0001
  one_step: 0.0
  trajectory: 10.0
  mass_balance: 0.001
  species_mass_balance: 0.001
  energy_balance: 0.001

state_loss_weights:
  Ca: 1.0
  Cb: 2.0
  T: 1.0
  Tc: 1.0

kl_annealing:
  start_weight: 0.0
  end_weight: 0.0001
  anneal_steps: 5000

sde_training:
  enabled: false           # set true to enable stochastic SDE training path
  warmup_steps: 2000       # steps of deterministic warmup before SDE path activates
  sde_kl_weight: 0.00001  # regularization weight on diffusion magnitudes

curriculum:
  enabled: false
  initial_seq_len: 5
  final_seq_len: 50
  warmup_epochs: 20

teacher_forcing:
  initial_ratio: 1.0       # fraction of loss from teacher-forced one-step path
  final_ratio: 0.0
  anneal_epochs: 30

checkpointing:
  save_every: 10
  save_best: true
  output_dir: outputs/
