system:
  name: isothermal_cstr
  unit_type: stirred_tank_reactor
  family: reactor
  subtype: slow_kinetics_isothermal
  law_tags: [mass_balance, reaction_kinetics]
  conditioning_tags:
    reaction_class: irreversible_first_order
    thermo_regime: isothermal_liquid_well_mixed
    bio_model_family: none
    operating_regime: slow_kinetics
  state_names: [Ca, Cb]
  state_groups:
    - name: species
      kind: concentration
      indices: [0, 1]
  state_channels:
    - name: Ca
      role: concentration
      unit: mol/L
      lower_bound: 0.0
      upper_bound: 3.0
      conserved_group: species
    - name: Cb
      role: concentration
      unit: mol/L
      lower_bound: 0.0
      upper_bound: 3.0
      conserved_group: species
  control_names: [F_in]
  control_channels:
    - name: F_in
      role: flow
      unit: L/min
      lower_bound: 15.0
      upper_bound: 110.0
  disturbance_names: [Ca_in]
  disturbance_channels:
    - name: Ca_in
      role: concentration
      unit: mol/L
      lower_bound: 0.4
      upper_bound: 1.6
  parameter_descriptors:
    - name: V
      unit: L
      law_tag: geometry
    - name: k0
      unit: 1/min
      law_tag: kinetics
    - name: Ea_over_R
      unit: K
      law_tag: kinetics
    - name: T_ref
      unit: K
      law_tag: thermodynamics
  normalization:
    state_center: [0.9, 0.7]
    state_scale: [1.0, 1.0]
    control_center: [62.5]
    control_scale: [0.02]
    disturbance_center: [1.0]
    disturbance_scale: [1.0]
    param_scale: 0.1
  decoder_constraints:
    - type: softplus
      indices: [0, 1]
      bias: 0.5

isothermal_cstr:
  V: 110.0
  k0: 2.0e10
  Ea_over_R: 9200.0
  T_ref: 315.0

simulation:
  dt: 0.1
  t_span: [0.0, 100.0]

data_generation:
  control_signals:
    F_in:
      type: mixed
      switch_prob: 0.05
      n_changes: 5
  disturbance_signals:
    Ca_in:
      type: prbs
      switch_prob: 0.01

initial_conditions:
  Ca: 0.8
  Cb: 0.3

operating_ranges:
  F_in: [15.0, 110.0]
  Ca_in: [0.4, 1.6]
