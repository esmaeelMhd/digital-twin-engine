# Shared-checkpoint universal baseline for mixed-system training.

model:
  family: universal_backbone
  latent_dim: 32
  shared_hidden_dim: 128
  system_embedding_dim: 32
  state_group_token_dim: 96
  state_group_kind_dim: 16
  state_group_encoder_layers: 2
  state_group_coupling_layers: 2
  encoder_layers: 3
  decoder_layers: 3
  drift_layers: 3
  use_system_spec_embedding: true
  use_variational_encoder: true
  neural_cde:
    enabled: true
    hidden_dim: 64
    n_layers: 2

training:
  batch_size: 128
  seq_len: 50
  stride: 10
  val_split: 0.2
  n_epochs: 20
  mixed_batching: weighted
  max_batches_per_epoch: null

loss_weights:
  reconstruction: 1.0
  trajectory: 1.0
  one_step: 0.5
  kl: 0.0001

optimizer:
  peak_lr: 0.0005
  end_lr: 0.00001
  warmup_steps: 50
  total_steps: 2000
  gradient_clip: 1.0

checkpointing:
  val_every: 1
  save_every: 5
  max_val_batches: 4

data:
  systems:
    - name: cstr
      system_config: configs/cstr_default.yaml
      data_dir: data/cstr/
      weight: 1.0
    - name: heat_exchanger
      system_config: configs/heat_exchanger_default.yaml
      data_dir: data/heat_exchanger/
      weight: 1.0
    - name: two_tank
      system_config: configs/two_tank_default.yaml
      data_dir: data/two_tank/
      weight: 1.0

evaluation:
  per_system_batches: 4
  aggregate_method: geometric_mean
  metric_name: geometric_mean_per_system_total_loss
