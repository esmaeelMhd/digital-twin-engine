system:
  name: cstr
  unit_type: stirred_tank_reactor
  family: reactor
  subtype: nonisothermal_cstr
  law_tags: [mass_balance, energy_balance, reaction_kinetics]
  conditioning_tags:
    reaction_class: irreversible_exothermic
    thermo_regime: liquid_well_mixed
    bio_model_family: none
    operating_regime: nominal_continuous
  state_names: [Ca, Cb, T, Tc]
  state_groups:
    - name: species
      kind: concentration
      indices: [0, 1]
    - name: temperatures
      kind: thermal
      indices: [2, 3]
  state_channels:
    - name: Ca
      role: concentration
      unit: mol/L
      lower_bound: 0.0
      conserved_group: species
    - name: Cb
      role: concentration
      unit: mol/L
      lower_bound: 0.0
      conserved_group: species
    - name: T
      role: temperature
      unit: K
      lower_bound: 250.0
      upper_bound: 400.0
      conserved_group: temperatures
    - name: Tc
      role: temperature
      unit: K
      lower_bound: 250.0
      upper_bound: 400.0
      conserved_group: temperatures
  control_names: [F_in, Tc_in]
  control_channels:
    - name: F_in
      role: flow
      unit: L/min
      lower_bound: 10.0
      upper_bound: 100.0
    - name: Tc_in
      role: temperature
      unit: K
      lower_bound: 280.0
      upper_bound: 320.0
  disturbance_names: [Ca_in, T_in]
  disturbance_channels:
    - name: Ca_in
      role: concentration
      unit: mol/L
      lower_bound: 0.5
      upper_bound: 2.0
    - name: T_in
      role: temperature
      unit: K
      lower_bound: 290.0
      upper_bound: 350.0
  parameter_descriptors:
    - name: V
      unit: L
      law_tag: geometry
    - name: Ea_over_R
      unit: K
      law_tag: kinetics
    - name: dH_rxn
      unit: J/mol
      law_tag: thermodynamics
    - name: UA
      unit: J/(min*K)
      law_tag: heat_transfer
    - name: Fc
      unit: L/min
      law_tag: hydraulics
    - name: Cp
      unit: J/(g*K)
      law_tag: thermodynamics
  normalization:
    state_center: [1.0, 1.0, 325.0, 325.0]
    state_scale: [1.0, 1.0, 0.01, 0.01]
    control_center: [55.0, 300.0]
    control_scale: [0.02, 0.05]
    disturbance_center: [1.0, 320.0]
    disturbance_scale: [1.0, 0.02]
    param_scale: 0.1
  decoder_constraints:
    - type: softplus
      indices: [0, 1]
      bias: 0.5
    - type: sigmoid_range
      indices: [2, 3]
      low: 250.0
      high: 400.0

cstr:
  V: 100.0
  Vc: 20.0
  k0: 7.2e10
  Ea_over_R: 8750.0
  dH_rxn: -50000.0
  rho: 1000.0
  Cp: 0.239
  UA: 50000.0
  rho_c: 1000.0
  Cp_c: 4.18
  Fc: 15.0

simulation:
  dt: 0.1
  t_span: [0.0, 100.0]

data_generation:
  control_signals:
    F_in:
      type: mixed
      switch_prob: 0.05
      n_changes: 5
    Tc_in:
      type: mixed
      switch_prob: 0.05
      n_changes: 5
  disturbance_signals:
    Ca_in:
      type: prbs
      switch_prob: 0.01
    T_in:
      type: prbs
      switch_prob: 0.01

initial_conditions:
  Ca: 0.5
  Cb: 0.5
  T: 350.0
  Tc: 300.0

operating_ranges:
  F_in: [10.0, 100.0]
  Tc_in: [280.0, 320.0]
  Ca_in: [0.5, 2.0]
  T_in: [290.0, 350.0]
