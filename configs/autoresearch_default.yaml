research:
  workspace_dir: outputs/autoresearch
  metric_name: best_val_loss
  metric_mode: min
  time_budget_minutes: 30
  hard_timeout_buffer_minutes: 5
  promote_if_improved: true

train:
  config: configs/training_default.yaml
  cstr_config: configs/cstr_default.yaml
  data_dir: data/cstr/
  n_epochs: 250
  batch_size: null
  val_every: 1
  seed: 42

agent:
  default_llm: gemini-3.1-pro-preview
  adaptive_temperature: true
  max_fail_streak_temp: 0.5
  cooldown_between_experiments: 10
  modifiable_files:
    - configs/training_default.yaml
    - scripts/train.py
    - dte/models/encoder.py
    - dte/models/decoder.py
    - dte/models/latent_sde.py
    - dte/models/digital_twin.py
    - dte/training/trainer.py
    - dte/training/losses.py
