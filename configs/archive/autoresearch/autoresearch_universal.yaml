# Scaffold config for future universal-model autoresearch.
# Current scripts/autoresearch.py does not train a shared universal checkpoint yet.

research:
  workspace_dir: outputs/autoresearch_universal
  metric_name: aggregate_relative_best_val_loss
  metric_mode: min
  aggregate_method: weighted_geometric_mean_ratio
  time_budget_minutes: 30
  promote_if_improved: true

universal:
  train_script: scripts/train_universal.py
  eval_script: scripts/evaluate_universal.py
  training_config: configs/training_universal.yaml
  single_checkpoint: true
  target_mode: shared_backbone

data:
  systems:
    - name: cstr
      system_config: configs/cstr_default.yaml
      data_dir: data/cstr/
      weight: 1.0
    - name: heat_exchanger
      system_config: configs/heat_exchanger_default.yaml
      data_dir: data/heat_exchanger/
      weight: 1.0
    - name: two_tank
      system_config: configs/two_tank_default.yaml
      data_dir: data/two_tank/
      weight: 1.0

agent:
  execution_mode: multi_file
  context_file: docs/autoresearch_ideas/auto_research_moonshot.md
  modifiable_paths:
    - dte
    - configs
    - scripts
  notes:
    - This scaffold config is for a future universal harness.
    - It requires one shared-checkpoint trainer and evaluator.
