# Round 2 local search around the promoted Neural CDE foundation winner.
# This config is for a fresh bounded workspace built from the current main-branch
# baseline, not the original pre-Neural-CDE foundation baseline.
#
# Suggested manual backlog:
#   auto_research_foundation_round2_neural_cde_ideas.yaml

research:
  workspace_dir: outputs/autoresearch_foundation_moonshot_round2
  metric_name: aggregate_relative_best_val_loss
  metric_mode: min
  aggregate_method: weighted_geometric_mean_ratio
  time_budget_minutes: 15
  time_budget_mode: split_total
  hard_timeout_buffer_minutes: 5
  promote_if_improved: true

train:
  config: configs/training_default.yaml
  targets:
    - name: cstr
      config: configs/training_default.yaml
      system_config: configs/cstr_default.yaml
      data_dir: data/cstr/
      weight: 1.0
    - name: heat_exchanger
      config: configs/heat_exchanger_training.yaml
      system_config: configs/heat_exchanger_default.yaml
      data_dir: data/heat_exchanger/
      weight: 1.0
    - name: two_tank
      config: configs/two_tank_training.yaml
      system_config: configs/two_tank_default.yaml
      data_dir: data/two_tank/
      weight: 1.0
  n_epochs: 15
  batch_size: null
  val_every: 1
  seed: 42

agent:
  execution_mode: multi_file
  default_llm: codex:gpt-5.4
  adaptive_temperature: false
  thinking_level: xhigh
  apply_llm: codex:gpt-5.4
  apply_thinking_level: low
  eval_on_keep: true
  eval_every_n_runs: 0
  eval_n_trajectories: 8
  eval_predict_mode: deterministic
  eval_plot_count: 0
  eval_skip_ensemble: true
  cooldown_between_experiments: 10
  context_file: auto_research_moonshot.md
  modifiable_paths:
    - dte/models/latent_sde.py
    - dte/models/digital_twin.py
    - dte/training/trainer.py
    - configs/training_default.yaml
    - configs/heat_exchanger_training.yaml
    - configs/two_tank_training.yaml
  forbidden_paths:
    - scripts/autoresearch.py
    - dte/autoresearch
    - scripts/agent.py
    - dte/data
    - dte/physics
    - dte/simulators
    - dte/models/universal_digital_twin.py
    - dte/training/universal_trainer.py
    - scripts/train_universal.py
    - scripts/evaluate_universal.py
    - auto_research.md
    - auto_research_moonshot.md
    - program.md
