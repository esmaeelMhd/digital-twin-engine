# Stage 2: Aggressive configuration for GPT moonshot ideas
# Larger models, longer sequences, and several high-upside options enabled

model:
  latent_dim: 32
  hidden_dim: 128
  n_layers: 3
  drift_layers: 3
  diffusion_layers: 3
  diffusion_hidden_dim: 64
  initial_diffusion_scale: 0.01
  # state_dim, control_dim, etc. come from SystemSpec
  use_dimensionless_inputs: true
  use_koopman_residual: true
  use_neural_cde: true
  port_hamiltonian: false
  use_simulator_residual: false
  use_system_backbone_conditioning: true
  use_process_graph_hypernetwork: false

sde:
  solver: "euler_heun"
  dt_ratio: 0.25
  mode: "sde"

training:
  n_epochs: 50
  batch_size: 64
  max_batches_per_epoch: 64
  seq_len: 30
  stride: 5
  val_split: 0.2

optimizer:
  peak_lr: 5.0e-4
  warmup_steps: 800
  total_steps: 8000
  end_lr: 5.0e-7
  gradient_clip: 0.5
  weight_decay: 0.0001

loss_weights:
  reconstruction: 1.0
  kl: 0.0001
  one_step: 0.5
  trajectory: 8.0
  mass_balance: 0.001
  energy_balance: 0.001

kl_annealing:
  start_weight: 0.0
  end_weight: 0.0001
  anneal_steps: 4000

sde_training:
  enabled: true
  warmup_steps: 1500
  sde_kl_weight: 0.00001

curriculum:
  enabled: true
  initial_seq_len: 8
  final_seq_len: 40
  warmup_epochs: 15

teacher_forcing:
  initial_ratio: 1.0
  final_ratio: 0.0
  anneal_epochs: 25

checkpointing:
  save_every: 8
  save_best: true
  output_dir: outputs/gpt_moonshot_stage2/

dimensionless_features:
  include_log_features: true
  include_ratio_features: true
  ratio_clip: 20.0

contrastive_alignment:
  enabled: true
  weight: 0.02
  temperature: 0.15

koopman:
  residual_scale_init: 0.1
  spectral_radius_limit: 1.0

neural_cde:
  derivative_smoothing: "finite_difference"
  control_path_scale: 1.0

simulator_residual:
  residual_scale_init: 0.02
  stop_gradient_through_simulator: false

pretraining:
  enabled: true
  n_steps: 2000
  mask_fraction: 0.4
  mask_strategy: "block"
  across_systems: true

joint_training:
  enabled: true
  system_sampling: "round_robin"
  shared_backbone: true

process_graph:
  enabled: false
  node_dim: 64
  edge_dim: 32
