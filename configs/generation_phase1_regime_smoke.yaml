# Smoke corpus manifest for Phase 1 base systems plus first regime variants.

seed: 42

defaults:
  n_trajectories: 32
  n_steps: 64
  simulation_mode: dataset
  output_root: data/phase1_regime_smoke

systems:
  - name: cstr
    system_config: configs/cstr_default.yaml
    output_dir: data/phase1_regime_smoke/cstr
  - name: cstr_fast_kinetics
    system_config: configs/cstr_fast_kinetics_hot_feed.yaml
    output_dir: data/phase1_regime_smoke/cstr_fast_kinetics
  - name: isothermal_cstr
    system_config: configs/isothermal_cstr_default.yaml
    output_dir: data/phase1_regime_smoke/isothermal_cstr
  - name: isothermal_cstr_slow_kinetics
    system_config: configs/isothermal_cstr_slow_kinetics.yaml
    output_dir: data/phase1_regime_smoke/isothermal_cstr_slow_kinetics
  - name: heat_exchanger
    system_config: configs/heat_exchanger_default.yaml
    output_dir: data/phase1_regime_smoke/heat_exchanger
  - name: heat_exchanger_high_ua
    system_config: configs/heat_exchanger_high_ua.yaml
    output_dir: data/phase1_regime_smoke/heat_exchanger_high_ua
  - name: two_tank
    system_config: configs/two_tank_default.yaml
    output_dir: data/phase1_regime_smoke/two_tank
  - name: two_tank_high_throughput
    system_config: configs/two_tank_high_throughput.yaml
    output_dir: data/phase1_regime_smoke/two_tank_high_throughput
  - name: storage_tank
    system_config: configs/storage_tank_default.yaml
    output_dir: data/phase1_regime_smoke/storage_tank
  - name: storage_tank_high_holdup
    system_config: configs/storage_tank_high_holdup.yaml
    output_dir: data/phase1_regime_smoke/storage_tank_high_holdup
  - name: separator
    system_config: configs/separator_default.yaml
    output_dir: data/phase1_regime_smoke/separator
  - name: separator_sharp_split
    system_config: configs/separator_sharp_split.yaml
    output_dir: data/phase1_regime_smoke/separator_sharp_split
  - name: bioreactor_compartment
    system_config: configs/bioreactor_compartment_default.yaml
    output_dir: data/phase1_regime_smoke/bioreactor_compartment
  - name: bioreactor_compartment_high_transfer
    system_config: configs/bioreactor_compartment_high_transfer.yaml
    output_dir: data/phase1_regime_smoke/bioreactor_compartment_high_transfer
